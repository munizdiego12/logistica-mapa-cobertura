# Alembic: migrations do banco. Rode SEMPRE de dentro da pasta backend/:
#   $env:DATABASE_URL = "<string do Neon>"        (PowerShell; só na sessão, nunca em arquivo)
#   python -m alembic upgrade head                 (aplica)
#   python -m alembic upgrade head --sql           (só mostra o SQL, sem tocar no banco)
#   python -m alembic current                      (versão aplicada)
# A URL NUNCA fica neste arquivo: migrations/env.py lê DATABASE_URL e usa asyncpg
# (o psycopg2 pode estar bloqueado no Windows).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
